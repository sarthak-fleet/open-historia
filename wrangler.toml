name = "open-historia"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "dist", binding = "ASSETS" }

routes = [
  { pattern = "historia.aliveville.com", custom_domain = true }
]

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
NODE_ENV = "production"
BETTER_AUTH_URL = "https://historia.aliveville.com"
