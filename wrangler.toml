name = "open-historia"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# psi-swarm flagged ~84% render delay (10.3s on mobile-slow). Smart
# Placement puts the Worker near Turso so server components don't
# pay a cross-region RTT on every request.
[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
NODE_ENV = "production"
