name = "open-historia"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

assets = { directory = "dist", binding = "ASSETS" }

[placement]
mode = "smart"

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
NODE_ENV = "production"