name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Prepare pnpm
        run: |
          corepack enable
          corepack install
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm cf:build
